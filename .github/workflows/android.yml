name: Scanner Android CI and Latest Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Kotlin source before signing
        run: gradle :app:compileDebugKotlin

      - name: Restore and verify stable signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          EXPECTED_SHA1="85EFC050123C89D9DA54763C70E6359DE107EAB2"
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the repository Actions secret ANDROID_DEBUG_KEYSTORE_BASE64 using the same stable keystore as HTML Editor."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F': ' '/SHA1:/ { gsub(":", "", $2); print toupper($2); exit }')"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key mismatch. Use the same stable debug keystore configured for HTML Editor."
            echo "Expected certificate SHA-1: $EXPECTED_SHA1"
            echo "Found certificate SHA-1: ${ACTUAL_SHA1:-missing}"
            exit 1
          fi
          echo "Stable signing certificate verified: $ACTUAL_SHA1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK package, Android minimum and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee /tmp/scanner-certificate.txt
          ACTUAL_SHA1="$(awk -F': ' '/certificate SHA-1 digest:/ { gsub(":", "", $2); print toupper($2); exit }' /tmp/scanner-certificate.txt)"
          EXPECTED_SHA1="85EFC050123C89D9DA54763C70E6359DE107EAB2"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/scanner-badging.txt
          grep -F "package: name='com.mobin.scanner' versionCode='1' versionName='1.0.0'" /tmp/scanner-badging.txt
          grep -F "sdkVersion:'29'" /tmp/scanner-badging.txt
          grep -E "^application: .*icon='res/" /tmp/scanner-badging.txt
          echo "Scanner APK package, minSdk, launcher icon and signature verified."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Scanner-APK
          path: release-assets

      - name: Replace previous releases with the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --repo "$REPOSITORY" --cleanup-tag --yes || true
          done < <(gh release list --repo "$REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')

          gh release create latest release-assets/app-debug.apk \
            --repo "$REPOSITORY" \
            --title "Scanner $VERSION_NAME (Latest)" \
            --notes "Latest automatic build of Scanner.\n\nApp version: $VERSION_NAME\nPackage: com.mobin.scanner\nMinimum Android: 10 (API 29)\nCommit: $GITHUB_SHA"
